    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "ファミコンソフトメモリアル",
        "description": "1980年代ファミリーコンピュータ（ファミコン）の懐かしいゲーム情報を検索できるサイト",
        "url": "https://love.fami-com.com/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://love.fami-com.com/?search={search_term_string}",
          "query-input": "required name=search_term_string"
        },
        "publisher": {
          "@type": "Organization",
          "name": "ファミコンソフトメモリアル"
        },
        "inLanguage": "ja-JP"
      }
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ItemList",
        "name": "ファミコンゲーム一覧",
        "description": "1980年代ファミリーコンピュータのゲーム一覧",
        "numberOfItems": 47,
        "itemListElement": [
          {
            "@type": "ListItem",
            "position": 1,
            "item": {
              "@type": "VideoGame",
              "name": "ドンキーコング",
              "description": "ファミコン本体と同時発売されたアーケード移植の決定版",
              "publisher": "任天堂",
              "datePublished": "1983",
              "genre": "アクション（固定画面型）"
            }
          },
          {
            "@type": "ListItem",
            "position": 2,
            "item": {
              "@type": "VideoGame",
              "name": "スーパーマリオブラザーズ",
              "description": "マリオとルイージがクッパを倒してピーチ姫を救う横スクロールアクション",
              "publisher": "任天堂",
              "datePublished": "1985",
              "genre": "アクション（横スクロール）"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1 class="title">ファミコンソフトメモリアル</h1>
        <p class="subtitle">
          1980年代ファミリーコンピュータ懐かしいゲームの情報を検索できます
        </p>
      </header>

      <section class="search-section">
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="タイトル、説明、レビューコメントで検索..."
          aria-label="ゲームを検索"
        />
        <!-- 50音順一覧トグルボタンを追加 -->
        <button
          id="gameListToggle"
          class="list-toggle-btn"
          type="button"
          aria-label="50音順ゲーム一覧を表示"
        >
          📋 50音順一覧
        </button>
        <!-- データ追加ボタンを追加 -->
        <button
          id="addGameBtn"
          class="add-game-btn"
          type="button"
          aria-label="ゲーム管理画面を開く"
        >
          ➕ ゲーム管理
        </button>
      </section>

      <main id="gamesContainer" class="games-container" role="main">
        <div class="loading">読み込み中...</div>
      </main>
    </div>

    <!-- トースト通知コンテナ -->
    <div
      id="toastContainer"
      class="toast-container"
      aria-live="polite"
      aria-atomic="true"
    ></div>

    <!-- 50音順一覧オーバーレイを追加 -->
    <div
      id="gameListOverlay"
      class="game-list-overlay hidden"
      role="dialog"
      aria-labelledby="gameListTitle"
    >
      <div class="game-list-container">
        <div class="game-list-header">
          <div class="game-list-title-section">
            <h2 id="gameListTitle" class="game-list-title">
              📋 ゲーム一覧（50音順）
            </h2>
            <span id="gameCount" class="game-count">0件</span>
          </div>
          <button
            id="gameListClose"
            class="close-btn"
            type="button"
            aria-label="一覧を閉じる"
          >
            ✕
          </button>
        </div>
        <div id="gameListContent" class="game-list-content">
          <div class="loading">読み込み中...</div>
        </div>
      </div>
    </div>

    <!-- ゲーム管理モーダル -->
    <div
      id="gameManagementModal"
      class="modal-overlay hidden"
      role="dialog"
      aria-labelledby="gameManagementTitle"
    >
      <div class="modal-container game-management-modal">
        <div class="modal-header">
          <h2 id="gameManagementTitle" class="modal-title">🎮 ゲーム管理</h2>
          <button
            id="gameManagementClose"
            class="close-btn"
            type="button"
            aria-label="モーダルを閉じる"
          >
            ✕
          </button>
        </div>
        <div class="modal-content">
          <!-- ゲーム追加セクション -->
          <div class="add-game-section">
            <h3 class="section-title">➕ 新しいゲームを追加</h3>
            <div class="form-group">
              <label for="gameJsonTextarea">JSONデータ:</label>
              <textarea
                id="gameJsonTextarea"
                class="json-textarea"
                placeholder="ゲームデータをJSON形式で入力してください..."
                rows="20"
              ></textarea>
            </div>
            <div class="form-actions">
              <button id="saveGameBtn" class="save-btn" type="button">
                💾 登録
              </button>
              <button id="clearFormBtn" class="clear-btn" type="button">
                🗑️ クリア
              </button>
            </div>
          </div>

          <!-- ファイル操作セクション -->
          <div class="file-operation-section">
            <h3 class="section-title">📁 ファイル操作</h3>
            <div class="file-actions">
              <button id="downloadJsonBtn" class="download-btn" type="button">
                📥 ダウンロード (games.json)
              </button>
              <label for="uploadJsonInput" class="upload-btn">
                📤 アップロード (games.json)
                <input
                  id="uploadJsonInput"
                  type="file"
                  accept=".json"
                  style="display: none"
                />
              </label>
            </div>
          </div>

          <!-- ゲーム一覧 -->
          <div class="game-list-section">
            <h3 class="game-list-title">📋 現在のゲーム一覧</h3>
            <div id="managementGameList" class="management-game-list">
              <div class="loading">読み込み中...</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
