<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="ファミコンソフトの詳細情報を検索できるWebアプリ"
    />
    <title>ファミコンソフトメモリアル</title>
  </head>
  <body>
    <div class="container">
      <header class="header">
        <h1 class="title">ファミコンソフトメモリアル</h1>
        <p class="subtitle">
          1980年代ファミリーコンピュータ懐かしいゲームの情報をふりかえり若返りましょう！
        </p>
      </header>

      <section class="search-section">
        <input
          type="search"
          id="searchInput"
          class="search-input"
          placeholder="タイトル、説明、レビューコメントで検索..."
        />
        <!-- 50音順一覧トグルボタンを追加 -->
        <button id="gameListToggle" class="list-toggle-btn" type="button">
          📋 50音順一覧
        </button>
      </section>

      <main id="gamesContainer" class="games-container">
        <div class="loading">読み込み中...</div>
      </main>
    </div>

    <!-- 50音順一覧オーバーレイを追加 -->
    <div id="gameListOverlay" class="game-list-overlay hidden">
      <div class="game-list-container">
        <div class="game-list-header">
          <div class="game-list-title-section">
            <h2 class="game-list-title">📋 ゲーム一覧（50音順）</h2>
            <span id="gameCount" class="game-count">0件</span>
          </div>
          <button id="gameListClose" class="close-btn" type="button">✕</button>
        </div>
        <div id="gameListContent" class="game-list-content">
          <div class="loading">読み込み中...</div>
        </div>
      </div>
    </div>
  </body>
</html>
